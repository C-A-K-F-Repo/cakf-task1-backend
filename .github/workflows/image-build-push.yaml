name: Build, Push, Deploy

on:
  push:
    branches: [main]

concurrency:
  group: cakf-backend-deploy
  cancel-in-progress: false

env:
  BACKEND_IMAGE_NAME: ghcr.io/c-a-k-f-repo/task1-backend
  STACK_NAME: cakf

jobs:
  build_push_deploy:
    environment: main
    permissions:
      packages: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          file: deployment/Dockerfile
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE_NAME }}:latest

      - name: Deploy to Docker Swarm
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_IP: ${{ vars.SERVER_IP }}
          SSH_CICD_USER: ${{ vars.SSH_CICD_USER }}
          TRAEFIK_ACME_EMAIL: ${{ vars.TRAEFIK_ACME_EMAIL }}
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          FROM_EMAIL: ${{ vars.FROM_EMAIL }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER || 'user' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB || 'fastapi_db' }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_SERVICE_SID: ${{ secrets.TWILIO_SERVICE_SID }}
          TWILIO_SENDER_PHONE: ${{ vars.TWILIO_SENDER_PHONE }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL || 'admin@cakf.com' }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_FULL_NAME: ${{ vars.ADMIN_FULL_NAME || 'Administrator' }}
          PERSONAL_DATA_ENCRYPTION_KEY: ${{ secrets.PERSONAL_DATA_ENCRYPTION_KEY }}
          PERSONAL_DATA_LOOKUP_KEY: ${{ secrets.PERSONAL_DATA_LOOKUP_KEY }}
          GRAFANA_ADMIN_USER: ${{ vars.GRAFANA_ADMIN_USER || 'admin' }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail

          required_vars=(
            SSH_PRIVATE_KEY
            SERVER_IP
            SSH_CICD_USER
            TRAEFIK_ACME_EMAIL
            JWT_SECRET
            FROM_EMAIL
            APP_PASSWORD
            POSTGRES_PASSWORD
            TWILIO_ACCOUNT_SID
            TWILIO_AUTH_TOKEN
            TWILIO_SERVICE_SID
            TWILIO_SENDER_PHONE
            GOOGLE_CLIENT_ID
            ADMIN_PASSWORD
            GRAFANA_ADMIN_PASSWORD
            PERSONAL_DATA_ENCRYPTION_KEY
            PERSONAL_DATA_LOOKUP_KEY
          )
          missing_vars=()
          for var_name in "${required_vars[@]}"; do
            if [ -z "${!var_name:-}" ]; then
              missing_vars+=("${var_name}")
            fi
          done
          if [ "${#missing_vars[@]}" -gt 0 ]; then
            printf 'Missing required GitHub Actions secrets/variables:\n'
            printf ' - %s\n' "${missing_vars[@]}"
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/cakf_cicd_key
          chmod 600 ~/.ssh/cakf_cicd_key
          ssh-keyscan -H "${SERVER_IP}" >> ~/.ssh/known_hosts
          {
            printf 'Host cakf-swarm\n'
            printf '  HostName %s\n' "${SERVER_IP}"
            printf '  User %s\n' "${SSH_CICD_USER}"
            printf '  IdentityFile ~/.ssh/cakf_cicd_key\n'
            printf '  StrictHostKeyChecking yes\n'
          } > ~/.ssh/config

          ssh cakf-swarm "
            set -e
            docker network inspect public >/dev/null 2>&1 || docker network create -d overlay --attachable public
            docker volume inspect traefik_acme >/dev/null 2>&1 || docker volume create traefik_acme
          "

          docker context rm remote-vps --force >/dev/null 2>&1 || true
          docker context create remote-vps --docker "host=ssh://cakf-swarm"
          docker --context remote-vps stack deploy --prune -c deployment/swarm/traefik-stack.yaml traefik
          docker --context remote-vps stack deploy --prune --with-registry-auth -c deployment/swarm/docker-compose.yaml "${STACK_NAME}"
